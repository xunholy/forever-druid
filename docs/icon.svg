<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#21503a"/>
      <stop offset="1" stop-color="#0a1a13"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa53f"/>
      <stop offset="1" stop-color="#df5708"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#f6ffb8"/>
      <stop offset="1" stop-color="#9be235"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f05a"/>
      <stop offset="1" stop-color="#5fae25"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="262" r="210" fill="#fff"/>
      <circle cx="294" cy="234" r="203" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" fill="#eadfa8" mask="url(#crescent)"/>
  <!-- cat head with cheek tufts -->
  <path fill="url(#fur)" d="M256 406 C222 406 188 392 164 366 L126 348 L146 332 L110 306 L136 296 C126 268 126 238 138 212 L146 98 L216 162 C229 158 242 156 256 156 C270 156 283 158 296 162 L366 98 L374 212 C386 238 386 268 376 296 L402 306 L366 332 L386 348 L348 366 C324 392 290 406 256 406 Z"/>
  <!-- inner ears -->
  <path fill="#6e2404" opacity="0.6" d="M160 132 L166 196 L204 168 Z"/>
  <path fill="#6e2404" opacity="0.6" d="M352 132 L346 196 L308 168 Z"/>
  <!-- tabby stripes -->
  <g fill="#a53c04" opacity="0.75">
    <path d="M206 176 L222 172 L226 226 Z"/>
    <path d="M306 176 L290 172 L286 226 Z"/>
    <path d="M150 236 L186 244 L152 252 Z"/>
    <path d="M362 236 L326 244 L360 252 Z"/>
  </g>
  <!-- leaf on the brow -->
  <path fill="url(#leaf)" stroke="#2b5e12" stroke-width="3" d="M256 170 C280 186 286 220 256 248 C226 220 232 186 256 170 Z"/>
  <path stroke="#2b5e12" stroke-width="3" stroke-linecap="round" fill="none" d="M256 182 L256 246 M256 206 L268 196 M256 222 L244 212"/>
  <!-- slanted eyes -->
  <path fill="url(#eye)" d="M162 266 C184 252 222 262 238 290 C208 300 176 292 162 266 Z"/>
  <path fill="url(#eye)" d="M350 266 C328 252 290 262 274 290 C304 300 336 292 350 266 Z"/>
  <ellipse cx="208" cy="281" rx="5.5" ry="15" fill="#0e1d0c" transform="rotate(-8 208 281)"/>
  <ellipse cx="304" cy="281" rx="5.5" ry="15" fill="#0e1d0c" transform="rotate(8 304 281)"/>
  <!-- nose and muzzle -->
  <path fill="#4f1902" d="M238 330 L274 330 L256 350 Z"/>
  <path stroke="#4f1902" stroke-width="5" stroke-linecap="round" fill="none" d="M256 350 L256 366"/>
</svg>
